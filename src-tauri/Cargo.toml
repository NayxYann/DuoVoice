[package]
name = "duovoice"
version = "1.4.8"
description = "Low-latency LAN intercom for Windows"
authors = ["DuoVoice"]
edition = "2021"
rust-version = "1.90"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = ["tray-icon"] }
cpal = { version = "0.18.2", features = ["realtime"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hostname = "0.4"
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-updater = "=2.13.1"
tauri-plugin-process = "=2.4.0"
nnnoiseless = "0.5.2"

rtrb = "=0.4.0"
socket2 = "0.6"
