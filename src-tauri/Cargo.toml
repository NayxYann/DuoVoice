[package]
name = "duovoice"
version = "1.4.8"
default-run = "duovoice"
description = "Low-latency LAN intercom for Windows"
authors = ["DuoVoice"]
edition = "2021"
rust-version = "1.90"
build = "build.rs"

[[bin]]
name = "duovoice-linux"
path = "src/linux_main.rs"
required-features = ["linux-edition"]

[features]
linux-edition = []

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = ["tray-icon"] }
cpal = { version = "0.18.2", features = ["realtime"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hostname = "0.4"
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-updater = "=2.13.1"
tauri-plugin-process = "=2.4.0"
nnnoiseless = "0.5.2"

rtrb = "=0.4.0"
socket2 = "0.6"


[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.18.2", features = ["pulseaudio"] }
ksni = { version = "0.3.3", default-features = false, features = ["blocking", "async-io"] }
