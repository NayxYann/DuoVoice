<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DuoVoice</title>
</head>
<body>
  <main class="tray-panel">
    <header class="tray-header">
      <div id="trayGithubBrand" class="tray-brand tray-brand-link" role="link" tabindex="0" title="Open DuoVoice on GitHub" aria-label="Open DuoVoice on GitHub">
        <div class="tray-mark">D</div>
        <div class="tray-title">
          <div class="tray-name-row"><strong>DuoVoice</strong><span class="tray-version">1.4.1</span></div>
          <span id="trayStatus" class="tray-status offline"><i></i><span data-i18n="status.offline">Offline</span></span>
        </div>
      </div>
      <button id="closeTray" class="icon-button close-button" type="button" aria-label="Close"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
    </header>

    <section class="tray-summary-stack" aria-label="Quick lists">
      <div class="tray-popover-anchor">
        <button id="traySessionButton" class="tray-summary-row" type="button" aria-expanded="false">
          <span class="tray-summary-icon"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span>
          <span class="tray-summary-copy"><strong data-i18n="tray.session">Session</strong><small id="traySessionSummary">No session</small></span>
          <svg class="ui-icon tray-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
        </button>

        <div id="traySessionPopover" class="tray-list-popover hidden" role="dialog" aria-label="Session">
          <div class="tray-popover-head">
            <span><strong data-i18n="group.participantsTitle">Session participants</strong><small id="traySessionCount">0</small></span>
            <button id="closeTraySession" class="mini-icon-button" type="button" aria-label="Close"><svg class="ui-icon" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
          </div>
          <div id="traySessionMembers" class="tray-list-scroll"></div>
        </div>
      </div>

      <div class="tray-popover-anchor">
        <button id="trayFavoritesButton" class="tray-summary-row" type="button" aria-expanded="false">
          <span class="tray-summary-icon"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2Z"/></svg></span>
          <span class="tray-summary-copy"><strong data-i18n="tray.favorites">Favorites</strong><small id="trayFavoritesSummary">0 favorites</small></span>
          <svg class="ui-icon tray-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
        </button>

        <div id="trayFavoritesPopover" class="tray-list-popover hidden" role="dialog" aria-label="Favorites">
          <div class="tray-popover-head">
            <span><strong data-i18n="tray.favorites">Favorites</strong><small id="trayFavoritesCount">0</small></span>
            <button id="closeTrayFavorites" class="mini-icon-button" type="button" aria-label="Close"><svg class="ui-icon" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
          </div>
          <div id="trayFavoritesList" class="tray-list-scroll"></div>
        </div>
      </div>
    </section>

    <section class="action-grid" aria-label="Quick controls">
      <button id="quickMute" class="action-tile" type="button">
        <span class="tile-icon"><svg class="ui-icon mute-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/><path class="mute-slash" d="M4 4l16 16"/></svg></span>
        <span id="quickMuteText" class="tile-label" data-i18n="audio.mute">Mute</span>
      </button>
      <button id="openApp" class="action-tile" type="button">
        <span class="tile-icon"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><rect width="20" height="14" x="2" y="3" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></svg></span>
        <span class="tile-label" data-i18n="common.open">Open</span>
      </button>
      <button id="openSettings" class="action-tile" type="button">
        <span class="tile-icon"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.09a2 2 0 0 1 1 1.74v.5a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.09a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2Z"/><circle cx="12" cy="12" r="3"/></svg></span>
        <span class="tile-label" data-i18n="common.settings">Settings</span>
      </button>
    </section>

    <button id="quickConnect" class="session-action primary" type="button">
      <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
      <span id="quickConnectText" data-i18n="tray.connection">Connection</span>
    </button>

    <button id="quitTray" class="quit-button" type="button">
      <svg class="ui-icon power-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v10"/><path d="M6.4 5.6a8 8 0 1 0 11.2 0"/></svg>
      <span data-i18n="settings.quitDuoVoice">Quit DuoVoice</span>
    </button>

    <div id="quitConfirm" class="confirm-layer" aria-hidden="true">
      <div class="confirm-card" role="dialog" aria-modal="true" aria-labelledby="quitTitle">
        <div class="confirm-icon"><svg class="ui-icon power-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v10"/><path d="M6.4 5.6a8 8 0 1 0 11.2 0"/></svg></div>
        <strong id="quitTitle" data-i18n="quit.title">Quit DuoVoice?</strong>
        <p data-i18n="quit.body">The application and audio will be completely stopped.</p>
        <div class="confirm-actions">
          <button id="cancelQuit" type="button" data-i18n="common.cancel">Cancel</button>
          <button id="confirmQuit" class="danger" type="button" data-i18n="common.quit">Quit</button>
        </div>
      </div>
    </div>
  </main>
  <script type="module" src="/src/tray.js"></script>
</body>
</html>
