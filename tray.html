<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DuoVoice</title>
</head>
<body>
  <main class="tray-panel">
    <header class="tray-header">
      <div class="tray-brand">
        <div class="tray-mark">D</div>
        <div class="tray-title">
          <strong>DuoVoice</strong>
          <span id="trayStatus" class="tray-status offline"><i></i>Hors ligne</span>
        </div>
      </div>
      <button id="closeTray" class="icon-button close-button" type="button" aria-label="Fermer"></button>
    </header>

    <section class="host-card" aria-label="Connexion">
      <div class="host-copy">
        <span class="eyebrow">Hôte</span>
        <strong id="trayPeerName">Aucun hôte connecté</strong>
      </div>
      <select id="trayPeer" class="tray-peer-select" aria-label="Choisir un hôte">
        <option value="">Choisir un PC…</option>
      </select>
    </section>

    <section class="action-grid" aria-label="Contrôles rapides">
      <button id="quickConnect" class="action-tile primary" type="button">
        <span class="tile-icon connect-icon" aria-hidden="true"></span>
        <span id="quickConnectText" class="tile-label">Connexion</span>
      </button>

      <button id="quickMute" class="action-tile" type="button">
        <span class="tile-icon mute-icon" aria-hidden="true"></span>
        <span id="quickMuteText" class="tile-label">Muet</span>
      </button>

      <button id="openApp" class="action-tile" type="button">
        <span class="tile-icon app-icon" aria-hidden="true"></span>
        <span class="tile-label">Ouvrir</span>
      </button>

      <button id="openSettings" class="action-tile" type="button">
        <span class="tile-icon settings-icon" aria-hidden="true"></span>
        <span class="tile-label">Paramètres</span>
      </button>
    </section>

    <button id="quitTray" class="quit-button" type="button">
      <svg class="power-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v10"/><path d="M6.4 5.6a8 8 0 1 0 11.2 0"/></svg>
      Quitter DuoVoice
    </button>

    <div id="quitConfirm" class="confirm-layer" aria-hidden="true">
      <div class="confirm-card" role="dialog" aria-modal="true" aria-labelledby="quitTitle">
        <div class="confirm-icon"><svg class="power-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v10"/><path d="M6.4 5.6a8 8 0 1 0 11.2 0"/></svg></div>
        <strong id="quitTitle">Quitter DuoVoice ?</strong>
        <p>L’application et l’audio seront complètement arrêtés.</p>
        <div class="confirm-actions">
          <button id="cancelQuit" type="button">Annuler</button>
          <button id="confirmQuit" class="danger" type="button">Quitter</button>
        </div>
      </div>
    </div>
  </main>
  <script type="module" src="/src/tray.js"></script>
</body>
</html>
