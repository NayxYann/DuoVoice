<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DuoVoice</title>
</head>
<body>
  <main class="tray-panel">
    <header class="tray-header">
      <div class="tray-brand">
        <div class="tray-mark">D</div>
        <div class="tray-title">
          <strong>DuoVoice</strong>
          <span id="trayStatus" class="tray-status offline"><i></i>Hors ligne</span>
        </div>
      </div>
      <button id="closeTray" class="tray-close" type="button" aria-label="Fermer">×</button>
    </header>

    <div id="trayPeerName" class="tray-peer-name">Aucun correspondant</div>

    <select id="trayPeer" class="tray-peer-select" aria-label="Ordinateur distant">
      <option value="">Choisir un PC…</option>
    </select>

    <div class="quick-actions">
      <button id="quickConnect" class="quick-action accent-action" type="button">
        <span class="quick-icon">↔</span>
        <span id="quickConnectText">Se connecter</span>
      </button>
      <button id="quickMute" class="quick-action" type="button">
        <span class="quick-icon">🎙</span>
        <span id="quickMuteText">Muet</span>
      </button>
      <button id="openApp" class="quick-action" type="button">
        <span class="quick-icon">▣</span>
        <span>Ouvrir DuoVoice</span>
      </button>
    </div>

    <footer class="tray-footer">
      <button id="openSettings" type="button">Paramètres</button>
      <span></span>
      <button id="quitTray" type="button">Quitter</button>
    </footer>
  </main>
  <script type="module" src="/src/tray.js"></script>
</body>
</html>
