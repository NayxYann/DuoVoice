<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DuoVoice</title>
</head>
<body>
  <main class="tray-panel">
    <header class="tray-header">
      <div class="tray-brand">
        <div class="tray-mark">D</div>
        <div class="tray-title">
          <strong>DuoVoice</strong>
          <span>Intercom local</span>
        </div>
      </div>
      <button id="closeTray" class="tray-close" type="button" aria-label="Fermer">×</button>
    </header>

    <div class="tray-status-row">
      <span id="trayStatus" class="tray-status offline"><i></i>Hors ligne</span>
      <span id="trayPeerName" class="tray-peer-name">Aucun correspondant</span>
    </div>

    <select id="trayPeer" class="tray-peer-select" aria-label="Ordinateur distant">
      <option value="">Choisir un PC…</option>
    </select>

    <section class="quick-grid">
      <button id="quickConnect" class="quick-tile accent-tile" type="button">
        <span class="quick-icon">↔</span>
        <span id="quickConnectText">Se connecter</span>
      </button>
      <button id="quickMute" class="quick-tile" type="button">
        <span class="quick-icon">🎙</span>
        <span id="quickMuteText">Muet</span>
      </button>
      <button id="openApp" class="quick-tile" type="button">
        <span class="quick-icon">▣</span>
        <span>Ouvrir</span>
      </button>
      <button id="openSettings" class="quick-tile" type="button">
        <span class="quick-icon">⚙</span>
        <span>Paramètres</span>
      </button>
    </section>

    <button id="quitTray" class="tray-quit" type="button">Quitter DuoVoice</button>
  </main>
  <script type="module" src="/src/tray.js"></script>
</body>
</html>
