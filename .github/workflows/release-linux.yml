name: Release Linux Preview

on:
  push:
    tags:
      - linux-v*-preview.*

permissions:
  contents: write

concurrency:
  group: linux-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true

      - name: Verify Linux preview tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          expected_prefix="linux-v${version}-preview."
          preview_number="${RELEASE_TAG#"$expected_prefix"}"
          if [[ "$RELEASE_TAG" != "$expected_prefix"* || ! "$preview_number" =~ ^[0-9]+$ ]]; then
            echo "Expected a tag starting with $expected_prefix followed by a preview number, received $RELEASE_TAG" >&2
            exit 1
          fi
          echo "PREVIEW_NUMBER=$preview_number" >> "$GITHUB_ENV"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libasound2-dev \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libpulse-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            pkg-config

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Check Linux preference helpers
        run: node --test tests/linux-state.test.mjs

      - name: Build Linux frontend
        env:
          TAURI_ENV_PLATFORM: linux
        run: npm run build

      - name: Test Linux Rust commands and shared audio engine
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --features linux-edition --bin duovoice-linux

      - name: Build Linux AppImage
        run: |
          cargo build --locked --manifest-path src-tauri/Cargo.toml --release --features linux-edition --bin duovoice-linux
          npm run tauri -- bundle --config src-tauri/tauri.linux.conf.json --bundles appimage

      - name: Verify Linux commands in the packaged binary
        run: |
          appimage=(src-tauri/target/release/bundle/appimage/*.AppImage)
          test "${#appimage[@]}" -eq 1
          chmod +x "${appimage[0]}"
          workdir=$(mktemp -d)
          trap 'rm -rf "$workdir"' EXIT
          (cd "$workdir" && "${GITHUB_WORKSPACE}/${appimage[0]}" --appimage-extract >/dev/null)
          binary="$workdir/squashfs-root/usr/bin/duovoice-linux"
          test -x "$binary"
          readelf -h "$binary" | grep -Eq 'Class:.*ELF64'
          readelf -h "$binary" | grep -Eq 'Machine:.*Advanced Micro Devices X86-64'
          for marker in "DuoVoice Linux starting" "list_linux_devices" "configure_linux_tray"; do
            if ! grep -aFq "$marker" "$binary"; then
              echo "Linux runtime command missing from packaged binary: $marker" >&2
              exit 1
            fi
          done

      - name: Package portable fallback and checksums
        run: |
          bash scripts/package-linux-portable.sh
          cd src-tauri/target/release/bundle/appimage
          sha256sum *.AppImage *-portable.tar.gz > SHA256SUMS

      - name: Publish Linux preview without changing Windows releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          title="DuoVoice Linux v${version} Preview ${PREVIEW_NUMBER}"
          notes=$(mktemp)
          cat > "$notes" <<'EOF'
          Linux preview for KDE Plasma and GNOME. It is published as a prerelease under a Linux-only tag, so the Windows stable release and its updater manifest remain unchanged. Audio uses PipeWire-Pulse or PulseAudio, with ALSA fallback.

          This preview uses the desktop's PulseAudio-compatible service (PipeWire-Pulse or PulseAudio) with ALSA fallback. The native tray is optional; if the desktop does not expose a StatusNotifier tray, DuoVoice stays usable from its main window.

          Make the AppImage executable before launching it. If FUSE is unavailable, extract the portable archive and launch `DuoVoice/AppRun`. See the Linux preview section in the repository README for supported baseline and network ports.
          EOF
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --prerelease \
            --title "$title" \
            --notes-file "$notes" \
            src-tauri/target/release/bundle/appimage/*.AppImage \
            src-tauri/target/release/bundle/appimage/*-portable.tar.gz \
            src-tauri/target/release/bundle/appimage/SHA256SUMS
