name: Build Windows and Linux

on:
  workflow_dispatch:
  push:
    branches: [dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify repository hygiene
        shell: bash
        run: |
          if git ls-files node_modules | grep -q .; then
            echo "::error::node_modules must not be committed. Run: git rm -r --cached node_modules"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Build frontend
        run: npm run build

      - name: Test shared backend
        run: cargo test --release --locked --manifest-path src-tauri/Cargo.toml

      - name: Build Tauri application
        run: npm run tauri -- build

      - name: Upload Windows installers
        uses: actions/upload-artifact@v7
        with:
          name: DuoVoice-Windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libasound2-dev libssl-dev build-essential pkg-config
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Test Linux interface state
        run: node --test tests/linux-state.test.mjs
      - name: Build frontend
        run: npm run build
      - name: Test Linux and shared backend
        run: cargo test --release --locked --manifest-path src-tauri/Cargo.toml
      - name: Build AppImage
        run: npm run tauri -- build --bundles appimage
      - name: Package portable fallback
        run: bash scripts/package-linux-portable.sh
      - name: Upload Linux downloads
        uses: actions/upload-artifact@v7
        with:
          name: DuoVoice-Linux-x86_64
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*-portable.tar.gz
          if-no-files-found: error
