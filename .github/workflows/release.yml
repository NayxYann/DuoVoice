name: Release DuoVoice

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to release (example: v1.4.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify repository hygiene
        shell: bash
        run: |
          if git ls-files node_modules | grep -q .; then
            echo "::error::node_modules must not be committed. Run: git rm -r --cached node_modules"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Verify updater configuration
        shell: bash
        run: |
          python - <<'PY'
          import json
          base = json.load(open("src-tauri/tauri.conf.json", encoding="utf-8"))
          release = json.load(open("src-tauri/tauri.release.conf.json", encoding="utf-8"))
          updater = base["plugins"]["updater"]
          assert release["bundle"]["createUpdaterArtifacts"] is True
          assert updater["pubkey"] and "__TAURI" not in updater["pubkey"]
          assert updater["endpoints"] == ["https://github.com/NayxYann/DuoVoice/releases/latest/download/latest.json"]
          assert base["bundle"]["targets"] == ["nsis", "msi"]
          print("Windows updater configuration OK")
          PY

      - name: Publish Windows release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag }}
          releaseName: "DuoVoice ${{ inputs.tag }}"
          releaseBody: 'DuoVoice Windows release.'
          releaseDraft: false
          prerelease: false
          projectPath: .
          args: --config src-tauri/tauri.release.conf.json
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
          retryAttempts: 3
