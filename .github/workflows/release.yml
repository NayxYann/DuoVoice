name: Release Windows and Linux

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to release (example: v1.5.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag }}
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify repository hygiene
        shell: bash
        run: |
          if git ls-files node_modules | grep -q .; then
            echo "::error::node_modules must not be committed. Run: git rm -r --cached node_modules"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify release version
        shell: bash
        run: node -e "if (process.env.RELEASE_TAG !== 'v' + require('./package.json').version) process.exit(1)"

      - name: Verify updater configuration
        shell: bash
        run: |
          python - <<'PY'
          import json
          base = json.load(open("src-tauri/tauri.conf.json", encoding="utf-8"))
          release = json.load(open("src-tauri/tauri.release.conf.json", encoding="utf-8"))
          updater = base["plugins"]["updater"]
          assert release["bundle"]["createUpdaterArtifacts"] is True
          assert updater["pubkey"] and "__TAURI" not in updater["pubkey"]
          assert updater["endpoints"] == ["https://github.com/NayxYann/DuoVoice/releases/latest/download/latest.json"]
          assert base["bundle"]["targets"] == ["nsis", "msi"]
          print("Windows updater configuration OK")
          PY

      - name: Test shared backend
        run: cargo test --release --locked --manifest-path src-tauri/Cargo.toml

      - name: Publish Windows release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag }}
          releaseName: "DuoVoice ${{ inputs.tag }}"
          releaseBody: 'DuoVoice for Windows and Linux. Linux downloads include an AppImage and a portable archive; the Linux build has no integrated updater.'
          releaseDraft: false
          prerelease: false
          projectPath: .
          args: --config src-tauri/tauri.release.conf.json
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
          retryAttempts: 3

  linux:
    needs: windows
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - name: Verify release version
        run: node -e "if (process.env.RELEASE_TAG !== 'v' + require('./package.json').version) process.exit(1)"
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libasound2-dev libssl-dev build-essential pkg-config
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Test interface state
        run: node --test tests/linux-state.test.mjs
      - name: Build frontend
        run: npm run build
      - name: Test Linux backend
        run: cargo test --release --locked --manifest-path src-tauri/Cargo.toml
      - name: Publish Linux AppImage
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag }}
          releaseName: "DuoVoice ${{ inputs.tag }}"
          releaseBody: 'DuoVoice for Windows and Linux. Linux downloads include an AppImage and a portable archive; the Linux build has no integrated updater.'
          releaseDraft: false
          prerelease: false
          projectPath: .
          args: --bundles appimage
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
          retryAttempts: 3
      - name: Package portable fallback
        run: bash scripts/package-linux-portable.sh
      - name: Upload portable archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$RELEASE_TAG" src-tauri/target/release/bundle/appimage/*-portable.tar.gz --clobber
