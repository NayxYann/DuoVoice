name: Release Windows

on:
  push:
    branches: [windows-v1.4.7]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to release (example: v1.4.7)'
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: windows-release-${{ inputs.tag || 'v1.4.7' }}
  cancel-in-progress: true

env:
  RELEASE_TAG: ${{ inputs.tag || 'v1.4.7' }}
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify release configuration
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          version = json.load(open('package.json'))['version']
          assert os.environ['RELEASE_TAG'] == 'v' + version
          base = json.load(open('src-tauri/tauri.conf.json'))
          release = json.load(open('src-tauri/tauri.release.conf.json'))
          assert base['version'] == version
          assert release['bundle']['createUpdaterArtifacts'] is True
          assert base['bundle']['targets'] == ['nsis', 'msi']
          assert base['plugins']['updater']['pubkey']
          result = subprocess.run(['gh', 'release', 'view', os.environ['RELEASE_TAG'], '--json', 'isDraft'], capture_output=True, text=True)
          if result.returncode == 0:
              assert json.loads(result.stdout)['isDraft'], 'This version is already published; do not overwrite it'
          elif 'release not found' not in result.stderr.lower() and '404' not in result.stderr:
              raise RuntimeError(result.stderr)
          print('Release configuration ready')
          PY
      - name: Reuse completed signed build when audio sources match
        id: signed
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          source = '5d581ff904e2b41d9ad51725f55a33611018f77c'
          ready = False
          try:
              subprocess.check_call(['git', 'fetch', '--depth=1', 'origin', source])
              same = subprocess.run(['git', 'diff', '--quiet', source, os.environ['GITHUB_SHA'], '--', '.', ':!.github/workflows/release.yml']).returncode == 0
              jobs = json.loads(subprocess.check_output(['gh', 'api', 'repos/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/38436967342/jobs'], text=True))['jobs']
              built = any(step['name'] == 'Build and sign Windows installers' and step['conclusion'] == 'success' for job in jobs for step in job['steps'])
              release = json.loads(subprocess.check_output(['gh', 'release', 'view', os.environ['RELEASE_TAG'], '--json', 'isDraft,assets'], text=True))
              names = [asset['name'] for asset in release['assets']]
              complete = 'latest.json' in names and all(any(name.endswith(extension) for name in names) for extension in ['.exe', '.exe.sig', '.msi', '.msi.sig'])
              ready = same and built and release['isDraft'] and complete
          except Exception as error:
              print('A fresh signed build is required:', str(error))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('ready=' + str(ready).lower() + '\n')
          print('Reusing signed installers' if ready else 'Building new signed installers')
          PY
      - name: Build and sign Windows installers
        if: steps.signed.outputs.ready != 'true'
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseCommitish: ${{ github.sha }}
          releaseName: DuoVoice ${{ env.RELEASE_TAG }}
          releaseBody: |
            Mise à jour Windows : amélioration du moteur audio lorsque le CPU ou le réseau est fortement sollicité.

            - Réduction de bruit et envoi réseau déplacés hors des callbacks audio.
            - Files audio préallouées sans verrou et priorité multimédia des workers Windows.
            - Buffer adaptatif de 40 à 180 ms, remise en ordre des paquets et atténuation des pertes brèves.
            - Backlogs audio limités et compteurs de diagnostic dans le journal local.

            Le protocole réseau reste compatible avec les versions Windows précédentes et la version Linux de développement.
            Installateurs Windows EXE/MSI et fichiers de mise à jour signés inclus.
          releaseDraft: true
          prerelease: false
          args: --config src-tauri/tauri.release.conf.json -- --locked
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
          retryAttempts: 2
      - name: Publish completed release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$RELEASE_TAG" --pattern latest.json --pattern "*.sig" --dir release-metadata
          python - <<'PY'
          import json, os, subprocess
          from urllib.parse import quote
          from pathlib import Path
          tag = os.environ['RELEASE_TAG']
          version = tag.removeprefix('v')
          branch = os.environ['GITHUB_REF_NAME']
          repo = os.environ['GITHUB_REPOSITORY']
          head = json.loads(subprocess.check_output(['gh', 'api', 'repos/' + repo + '/branches/' + branch], text=True))['commit']['sha']
          assert head == os.environ['GITHUB_SHA'], 'A newer commit superseded this release build'
          release = json.loads(subprocess.check_output(['gh', 'release', 'view', tag, '--json', 'isDraft,assets'], text=True))
          assert release['isDraft']
          names = [asset['name'] for asset in release['assets']]
          assert any(name.endswith('.exe') for name in names)
          assert any(name.endswith('.msi') for name in names)
          manifest = json.load(open('release-metadata/latest.json'))
          assert manifest['version'].removeprefix('v') == version
          # Construct public URLs from uploaded installer names. Draft asset URLs
          # can be private API endpoints rather than final browser download URLs.
          platforms = {}
          for extension, keys in [('.exe', ['windows-x86_64', 'windows-x86_64-nsis']), ('.msi', ['windows-x86_64-msi'])]:
              candidates = [name for name in names if name.endswith(extension) and version in name]
              assert len(candidates) == 1, str(candidates)
              name = candidates[0]
              signature = Path('release-metadata', name + '.sig').read_text(encoding='utf-8').strip()
              assert signature
              entry = {'signature': signature, 'url': 'https://github.com/' + repo + '/releases/download/' + tag + '/' + quote(name)}
              for key in keys:
                  platforms[key] = entry
          manifest['platforms'] = platforms
          with open('release-metadata/latest.json', 'w', encoding='utf-8') as file:
              json.dump(manifest, file, indent=2)
          subprocess.check_call(['gh', 'release', 'upload', tag, 'release-metadata/latest.json', '--clobber'])
          ref = 'repos/' + repo + '/git/refs/tags/' + tag
          read_ref = 'repos/' + repo + '/git/ref/tags/' + tag
          result = subprocess.run(['gh', 'api', read_ref], capture_output=True, text=True)
          if result.returncode == 0:
              obj = json.loads(result.stdout)['object']
              assert obj['type'] == 'commit'
              if obj['sha'] != os.environ['GITHUB_SHA']:
                  # A retry can replace a tag belonging to this unpublished draft.
                  subprocess.check_call(['gh', 'api', ref, '--method', 'PATCH', '-f', 'sha=' + os.environ['GITHUB_SHA'], '-F', 'force=true'])
          elif '404' in result.stderr:
              subprocess.check_call(['gh', 'api', 'repos/' + repo + '/git/refs', '--method', 'POST', '-f', 'ref=refs/tags/' + tag, '-f', 'sha=' + os.environ['GITHUB_SHA']])
          else:
              raise RuntimeError(result.stderr)
          PY
          gh release edit "$RELEASE_TAG" --draft=false --latest
