name: Release Windows

on:
  push:
    branches: [windows-v1.4.7]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to release (example: v1.4.7)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: windows-release-${{ inputs.tag || 'v1.4.7' }}
  cancel-in-progress: true

env:
  RELEASE_TAG: ${{ inputs.tag || 'v1.4.7' }}
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify release configuration
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          version = json.load(open('package.json'))['version']
          assert os.environ['RELEASE_TAG'] == 'v' + version
          base = json.load(open('src-tauri/tauri.conf.json'))
          release = json.load(open('src-tauri/tauri.release.conf.json'))
          assert base['version'] == version
          assert release['bundle']['createUpdaterArtifacts'] is True
          assert base['bundle']['targets'] == ['nsis', 'msi']
          assert base['plugins']['updater']['pubkey']
          result = subprocess.run(['gh', 'release', 'view', os.environ['RELEASE_TAG'], '--json', 'isDraft'], capture_output=True, text=True)
          if result.returncode == 0:
              assert json.loads(result.stdout)['isDraft'], 'This version is already published; do not overwrite it'
          elif 'release not found' not in result.stderr.lower() and '404' not in result.stderr:
              raise RuntimeError(result.stderr)
          print('Release configuration ready')
          PY
      - name: Build and sign Windows installers
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseCommitish: ${{ github.sha }}
          releaseName: DuoVoice ${{ env.RELEASE_TAG }}
          releaseBody: |
            Mise à jour Windows : amélioration du moteur audio lorsque le CPU ou le réseau est fortement sollicité.

            - Réduction de bruit et envoi réseau déplacés hors des callbacks audio.
            - Files audio préallouées sans verrou et priorité multimédia des workers Windows.
            - Buffer adaptatif de 40 à 180 ms, remise en ordre des paquets et atténuation des pertes brèves.
            - Backlogs audio limités et compteurs de diagnostic dans le journal local.

            Le protocole réseau reste compatible avec les versions Windows précédentes et la version Linux de développement.
            Installateurs Windows EXE/MSI et fichiers de mise à jour signés inclus.
          releaseDraft: true
          prerelease: false
          args: --config src-tauri/tauri.release.conf.json -- --locked
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
          retryAttempts: 2
      - name: Publish completed release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$RELEASE_TAG" --pattern latest.json --dir release-metadata
          python - <<'PY'
          import json, os, subprocess
          from urllib.parse import urlparse, unquote, quote
          tag = os.environ['RELEASE_TAG']
          version = tag.removeprefix('v')
          branch = os.environ['GITHUB_REF_NAME']
          repo = os.environ['GITHUB_REPOSITORY']
          head = json.loads(subprocess.check_output(['gh', 'api', 'repos/' + repo + '/branches/' + branch], text=True))['commit']['sha']
          assert head == os.environ['GITHUB_SHA'], 'A newer commit superseded this release build'
          release = json.loads(subprocess.check_output(['gh', 'release', 'view', tag, '--json', 'isDraft,assets'], text=True))
          assert release['isDraft']
          names = [asset['name'] for asset in release['assets']]
          assert any(name.endswith('.exe') for name in names)
          assert any(name.endswith('.msi') for name in names)
          manifest = json.load(open('release-metadata/latest.json'))
          assert manifest['version'].removeprefix('v') == version
          platform = manifest['platforms']['windows-x86_64']
          assert platform['signature']
          repo = os.environ['GITHUB_REPOSITORY']
          # Draft assets have temporary 'untagged-*' URLs. Signatures cover the
          # installer bytes, so normalize URLs before publishing the manifest.
          for entry in manifest['platforms'].values():
              name = unquote(urlparse(entry['url']).path.rsplit('/', 1)[-1])
              assert name in names
              entry['url'] = 'https://github.com/' + repo + '/releases/download/' + tag + '/' + quote(name)
          assert '/releases/download/' + tag + '/' in platform['url']
          with open('release-metadata/latest.json', 'w', encoding='utf-8') as file:
              json.dump(manifest, file, indent=2)
          subprocess.check_call(['gh', 'release', 'upload', tag, 'release-metadata/latest.json', '--clobber'])
          ref = 'repos/' + repo + '/git/refs/tags/' + tag
          read_ref = 'repos/' + repo + '/git/ref/tags/' + tag
          result = subprocess.run(['gh', 'api', read_ref], capture_output=True, text=True)
          if result.returncode == 0:
              obj = json.loads(result.stdout)['object']
              assert obj['type'] == 'commit'
              if obj['sha'] != os.environ['GITHUB_SHA']:
                  # A retry can replace a tag belonging to this unpublished draft.
                  subprocess.check_call(['gh', 'api', ref, '--method', 'PATCH', '-f', 'sha=' + os.environ['GITHUB_SHA'], '-F', 'force=true'])
          elif '404' in result.stderr:
              subprocess.check_call(['gh', 'api', 'repos/' + repo + '/git/refs', '--method', 'POST', '-f', 'ref=refs/tags/' + tag, '-f', 'sha=' + os.environ['GITHUB_SHA']])
          else:
              raise RuntimeError(result.stderr)
          PY
          gh release edit "$RELEASE_TAG" --draft=false --latest
