name: Release Linux on Stable

on:
  push:
    branches: [codex/linux-isolated-preview]
    paths:
      - release/linux-v1.4.8
      - .github/workflows/release-linux-stable.yml

permissions:
  contents: write

concurrency:
  group: linux-stable-release
  cancel-in-progress: false

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libasound2-dev \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libpulse-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            pkg-config

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Check Linux preference helpers
        run: node --test tests/linux-*.test.mjs

      - name: Build Linux frontend
        env:
          TAURI_ENV_PLATFORM: linux
        run: npm run build

      - name: Test Linux Rust commands and shared audio engine
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --features linux-edition --bin duovoice-linux

      - name: Build Linux AppImage
        run: npm run tauri -- build --config src-tauri/tauri.linux.conf.json --bundles appimage -- --bin duovoice-linux

      - name: Package portable fallback and checksums
        run: |
          bash scripts/package-linux-portable.sh
          cd src-tauri/target/release/bundle/appimage
          sha256sum *.AppImage *-portable.tar.gz > SHA256SUMS

      - name: Add Linux packages to the existing stable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          stable_tag="v${version}"
          gh release view "$stable_tag" --repo "$GITHUB_REPOSITORY"
          gh release upload "$stable_tag" \
            src-tauri/target/release/bundle/appimage/*.AppImage \
            src-tauri/target/release/bundle/appimage/*-portable.tar.gz \
            src-tauri/target/release/bundle/appimage/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
