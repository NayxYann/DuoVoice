name: Build Linux

on:
  push:
    branches: [codex/linux-isolated-preview]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: linux-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libasound2-dev \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libpulse-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            pkg-config

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Check Linux preference helpers
        run: node --test tests/linux-state.test.mjs

      - name: Build Linux frontend
        env:
          TAURI_ENV_PLATFORM: linux
        run: npm run build

      - name: Test Linux Rust commands and shared audio engine
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --features linux-edition --bin duovoice-linux

      - name: Build Linux AppImage
        run: npm run tauri -- build --config src-tauri/tauri.linux.conf.json --features linux-edition --bundles appimage -- --bin duovoice-linux

      - name: Verify Linux command handlers are in the packaged binary
        run: |
          binary=src-tauri/target/release/duovoice-linux
          for command in list_linux_devices configure_linux_tray linux_startup; do
            if ! grep -aFq "$command" "$binary"; then
              echo "Linux command handler missing from $binary: $command" >&2
              exit 1
            fi
          done

      - name: Package portable fallback
        run: |
          bash scripts/package-linux-portable.sh
          cd src-tauri/target/release/bundle/appimage
          sha256sum *.AppImage *-portable.tar.gz > SHA256SUMS

      - name: Publish Linux preview from the isolated branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/codex/linux-isolated-preview'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="linux-v${version}-preview.2"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Linux preview $tag already exists; skipping publication."
            exit 0
          fi
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "DuoVoice Linux v${version} Preview 2" \
            --notes "Linux preview for KDE Plasma and GNOME. It does not replace the Windows stable release or updater manifest. Requires a PulseAudio-compatible service (PipeWire-Pulse or PulseAudio), with ALSA fallback. The tray is optional. Make the AppImage executable; the portable archive is available when FUSE is unavailable. See the Linux preview section in README for requirements and network ports." \
            src-tauri/target/release/bundle/appimage/*.AppImage \
            src-tauri/target/release/bundle/appimage/*-portable.tar.gz \
            src-tauri/target/release/bundle/appimage/SHA256SUMS

      - name: Upload Linux preview artifacts
        uses: actions/upload-artifact@v7
        with:
          name: DuoVoice-Linux-x86_64
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*-portable.tar.gz
          if-no-files-found: error
