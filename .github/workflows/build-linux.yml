name: Build Linux

on:
  push:
    branches: [codex/linux-isolated-preview, codex/linux-audio-publish-1.4.8-v2]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: linux-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libasound2-dev \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libpulse-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            pkg-config

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Check Linux preference helpers
        run: node --test tests/linux-*.test.mjs

      - name: Build Linux frontend
        env:
          TAURI_ENV_PLATFORM: linux
        run: npm run build

      - name: Test Linux Rust commands and shared audio engine
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --features linux-edition --bin duovoice-linux

      - name: Build Linux AppImage
        run: npm run tauri -- build --config src-tauri/tauri.linux.conf.json --bundles appimage -- --bin duovoice-linux

      - name: Package portable fallback
        run: |
          bash scripts/package-linux-portable.sh
          cd src-tauri/target/release/bundle/appimage
          sha256sum *.AppImage *-portable.tar.gz > SHA256SUMS

      - name: Replace Linux assets on v1.4.8
        if: github.event_name == 'push' && github.ref == 'refs/heads/codex/linux-audio-publish-1.4.8-v2'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node -e "if (require('./package.json').version !== '1.4.8') process.exit(1)"
          gh release view v1.4.8 >/dev/null
          gh release upload v1.4.8 \
            src-tauri/target/release/bundle/appimage/*.AppImage \
            src-tauri/target/release/bundle/appimage/*-portable.tar.gz \
            src-tauri/target/release/bundle/appimage/SHA256SUMS \
            --clobber

      - name: Upload Linux preview artifacts
        uses: actions/upload-artifact@v7
        with:
          name: DuoVoice-Linux-x86_64
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*-portable.tar.gz
            src-tauri/target/release/bundle/appimage/SHA256SUMS
          if-no-files-found: error
